<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ぴったり給食当番</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
  }
  body {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2c1f17;
    background-image: radial-gradient(circle at 50% 40%, #4a3628 0%, #2c1f17 75%);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; touch-action: none; outline: none;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
  }
  #test-report {
    display: none; position: fixed; left: 0; right: 0; top: 0; max-height: 55%;
    overflow: auto; margin: 0; padding: 8px; z-index: 10;
    font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap;
    background: rgba(255, 255, 255, 0.94); color: #222;
    -webkit-user-select: text; user-select: text;
  }
  body.test #test-report { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="ぴったり給食当番"></canvas>
<pre id="test-report"></pre>
<script src="game.js"></script>
</body>
</html>
