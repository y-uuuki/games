<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ネコ、それダメ!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2b2430;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game {
    position: fixed;
    left: 0;
    top: 0;
    display: block;
    touch-action: none;
    outline: none;
  }
  #test-report {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: 8px;
    max-height: 45%;
    overflow: auto;
    margin: 0;
    padding: 8px;
    font: 11px/1.35 ui-monospace, Menlo, monospace;
    color: #e8ffe8;
    background: rgba(0, 0, 0, 0.82);
    border-radius: 8px;
    white-space: pre-wrap;
    z-index: 10;
  }
  #test-report:empty { display: none; }
</style>
<script>
  // Early error capture (catches vendor/game load errors too). game.js reads window.__errors.
  window.__errors = [];
  window.onerror = function (msg, src, line, col, err) {
    window.__errors.push(String((err && err.stack) || (msg + ' @ ' + src + ':' + line + ':' + col)));
    if (window.__onGameError) { try { window.__onGameError(); } catch (e) {} }
  };
  window.addEventListener('unhandledrejection', function (ev) {
    window.__errors.push('unhandledrejection: ' + String(ev && ev.reason));
    if (window.__onGameError) { try { window.__onGameError(); } catch (e) {} }
  });
  window.addEventListener('load', function () {
    if (!/[?&]test=1(&|$)/.test(location.search)) return;
    // Fallback: if the in-game test runner never wrote a report (e.g. game.js failed to load), fail loudly.
    setTimeout(function () {
      var pre = document.getElementById('test-report');
      if (pre && !pre.textContent) {
        pre.textContent = JSON.stringify({ pass: false, errors: window.__errors.concat(['test runner did not run']) }, null, 2);
        document.title = 'TEST FAIL';
      }
    }, 3000);
  });
</script>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<pre id="test-report"></pre>
<script src="vendor/matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
