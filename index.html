<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム試作</title>
<style>
  :root { --bg: #fdf6ec; --fg: #3b2f2a; --card: #fff; --accent: #e8743b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1b18; --fg: #f3ebe3; --card: #2b2521; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  a.card { display: block; padding: 18px 20px; margin-bottom: 14px; border-radius: 16px;
    background: var(--card); color: inherit; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  a.card strong { display: block; font-size: 20px; color: var(--accent); margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>ゲーム試作</h1>
  <a class="card" href="neko-sore-dame/index.html">
    <strong>ネコ、それダメ!</strong>
    ネコがテーブルの物を落とす前に、指ではじいて真ん中へ戻そう。3つ割れたらおしまい。
  </a>
  <a class="card" href="pittari-kyushoku/index.html">
    <strong>ぴったり給食当番</strong>
    鍋のカレーをクラス全員に同じ量ずつよそって、最後の一人でぴったり空にしよう。
  </a>
</main>
</body>
</html>
